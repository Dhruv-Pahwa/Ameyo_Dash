name: Daily snapshot

# GitHub starts scheduled runs hours late (observed: 5-6 hours), so the schedule below is spread
# across the day and every scheduled run checks the clock when it actually starts: it saves only
# between 21:00 and 23:00 IST and otherwise skips. The early slots (UTC 09:30-12:30) are the ones
# expected to start late enough to land in that window; the 15:30 and 16:30 UTC slots cover GitHub
# starting on time. A manual run ("Run workflow") saves whatever the sheet holds at that moment.
on:
  schedule:
    - cron: '30 9 * * *'
    - cron: '0 10 * * *'
    - cron: '30 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 11 * * *'
    - cron: '0 12 * * *'
    - cron: '30 12 * * *'
    - cron: '30 15 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save the sheets into history/
        env:
          ONLY_IN_WINDOW: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: bash scripts/snapshot.sh

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          days="$(git diff --cached --name-only -- history | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tr '\n' ' ')"
          git commit -m "Snapshot ${days}"
          git push
          # Pushes made with the workflow token do not start a Pages build on their own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
