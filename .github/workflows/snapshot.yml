name: Daily snapshot

# Runs at 21:00, 22:00 and 23:00 IST (15:30, 16:30 and 17:30 UTC) so the day's data is saved
# between 9 and 11 PM. GitHub starts scheduled runs on a best-effort basis, so one run can be late;
# the others cover it. Extra runs are harmless: a day is only rewritten when the sheet changed,
# and each snapshot is filed under the date inside the data.
on:
  schedule:
    - cron: '30 15 * * *'
    - cron: '30 16 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save the sheets into history/
        run: bash scripts/snapshot.sh

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          days="$(git diff --cached --name-only -- history | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}\.csv' | sed 's/\.csv$//' | tr '\n' ' ')"
          git commit -m "Snapshot ${days}"
          git push
          # Pushes made with the workflow token do not start a Pages build on their own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
