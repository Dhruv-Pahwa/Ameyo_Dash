name: Daily snapshot

# Started from outside GitHub at about 10 PM IST (a request to the workflow_dispatch API from a
# scheduler such as cron-job.org). GitHub's own schedule is not used: it started runs 5-6 hours late,
# which saved the sheet's early-morning state instead of the evening's. A run here only saves the
# sheet as it is at that moment, filed under the date inside the data.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save the sheets into history/
        run: bash scripts/snapshot.sh

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          days="$(git diff --cached --name-only -- history | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tr '\n' ' ')"
          git commit -m "Snapshot ${days}"
          git push
          # Pushes made with the workflow token do not start a Pages build on their own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
