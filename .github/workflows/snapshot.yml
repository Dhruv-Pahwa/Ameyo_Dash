name: Daily snapshot

# 23:00 IST = 17:30 UTC. GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save the sheets into history/
        run: bash scripts/snapshot.sh

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Snapshot $(TZ=Asia/Kolkata date +%F)"
          git push
          # Pushes made with the workflow token do not start a Pages build on their own.
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
